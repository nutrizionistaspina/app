<style>
/* Layout: app per telefono a colonna unica (max 560px), barra delle schede fissa in basso; su schermi larghi resta centrata come un telefono */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E8EEE7; --line:#D5DFD4; --ink:#16251D; --muted:#5C6E63;
  --brand:#2E5E45; --brand-ink:#FFFFFF; --leaf:#7FB069; --sun:#E3A33B; --warn:#B4532A; --ok:#2F7D50;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(22,37,29,.06),0 8px 24px rgba(22,37,29,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#17211B; --surface-2:#1F2B24; --line:#2B3A31; --ink:#E4EDE6; --muted:#9AAEA1;
  --brand:#7CC79B; --brand-ink:#0F1612; --leaf:#9BCB84; --sun:#EDB65A; --warn:#E48A62; --ok:#6FCB94; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211B; --surface-2:#1F2B24; --line:#2B3A31; --ink:#E4EDE6; --muted:#9AAEA1;
  --brand:#7CC79B; --brand-ink:#0F1612; --leaf:#9BCB84; --sun:#EDB65A; --warn:#E48A62; --ok:#6FCB94; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:8px}
.shell{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 160px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.1}h2{font-size:21px}h3{font-size:17px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brandmark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:15px}
.leafdot{width:30px;height:30px;border-radius:50% 50% 50% 8px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);transform:rotate(-8deg)}
.leafdot svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--surface-2);color:var(--muted)}
.chip.demo{background:color-mix(in srgb,var(--sun) 22%,var(--surface));color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.next{background:var(--brand);color:var(--brand-ink);border:0}
.next .muted{color:color-mix(in srgb,var(--brand-ink) 78%,transparent)}
.next h2{font-size:25px}
.when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.daynum{font-family:var(--f-display);font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.next .btn{background:color-mix(in srgb,var(--brand-ink) 14%,transparent);border-color:color-mix(in srgb,var(--brand-ink) 30%,transparent);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted)}
.tabs button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.meal{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding-block:12px;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:2px}
.mtime{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--brand);font-variant-numeric:tabular-nums;min-width:48px;padding-top:2px}
.mname{font-weight:700}
.mbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.opt{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.slot{display:flex;flex-direction:column;gap:2px}
.alts{font-size:14.5px;color:var(--muted)}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-weight:700;font-size:14px}
.days button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tip{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.tip:first-of-type{border-top:0;padding-top:0}
.vis{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start;padding-block:12px;border-top:1px solid var(--line)}
.vis:first-of-type{border-top:0}
.vdate{background:var(--surface-2);border-radius:14px;text-align:center;padding:8px 4px;font-variant-numeric:tabular-nums}
.vdate b{display:block;font-family:var(--f-display);font-size:24px;line-height:1}
.vdate span{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);fill:var(--muted);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.sup{display:flex;flex-direction:column;gap:4px;padding-block:12px;border-top:1px solid var(--line)}
.sup:first-of-type{border-top:0;padding-top:0}
.dose{display:inline-flex;align-self:flex-start;font-size:13.5px;font-weight:700;background:color-mix(in srgb,var(--leaf) 22%,var(--surface));border-radius:8px;padding:2px 8px}
.alert{border-left:4px solid var(--warn);padding:8px 12px;background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-radius:0 12px 12px 0;font-size:15px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .row{margin-top:8px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.lock{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:420px;margin:0 auto;padding-inline:16px;padding-block:24px}
.pin{display:flex;gap:8px;justify-content:center}
.pin input{width:100%;max-width:240px;text-align:center;font-family:var(--f-display);font-size:30px;letter-spacing:.35em;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--surface)}
.err{color:var(--warn);font-weight:700;font-size:15px;min-height:1.4em}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
textarea.code{width:100%;min-height:90px;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);font-size:13px}
.edoc{border-top:1px solid var(--line);padding-block:10px}.edoc:first-of-type{border-top:0}.edoc summary{cursor:pointer;font-size:16px;padding-block:4px}.edoc h3{margin-top:12px;font-size:16px}.edoc p{margin:4px 0 0}
.foot{font-size:13px;color:var(--muted);text-align:center;padding-top:6px}
.mat{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:10px 0;border-top:1px solid var(--line)}.mat:first-of-type{border-top:0}.mat span{display:flex;flex-direction:column;min-width:0}
.matic{flex:none;width:42px;height:48px;border-radius:8px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn);font-weight:700;font-size:12px;display:grid!important;place-items:center}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}.scale button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;font-size:16px;font-weight:700;padding:0}
.scale button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}.scale button.zone{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.scalel{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;min-height:40px}.tags button[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));font-weight:700}
.dline{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}.dline:last-child{border-bottom:0}
.mnote{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.qopts{display:flex;flex-direction:column;gap:6px}
.qopts button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:16px;min-height:46px}
.qopts button[aria-checked="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));font-weight:700}
.qnum{border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:17px;background:var(--surface);max-width:180px}
/* settimana e allenamento */
.hdf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.hdf:first-of-type{border-top:0}.hdf>span:first-child{font-weight:700}.hdf input{width:96px;text-align:right;border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;font-size:17px;background:var(--surface)}.hdf small{color:var(--muted);font-size:12.5px;display:block;text-align:right}.hdf>span:last-child{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.filebtn{align-self:flex-start;cursor:pointer}.steps{margin:0 0 12px;padding-left:20px;display:grid;gap:8px}.mnote+.mnote{margin-top:8px}
/* piano compatto */
.h1s{font-size:24px}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px}.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-weight:700;font-size:14.5px;color:var(--muted)}.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.meal2{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}.meal2:first-child{border-top:0}
.mh{display:flex;align-items:baseline;gap:10px}.mh .mname{flex:1}.mh .mtime{min-width:44px;font-size:14px}
.altb{border:0;background:transparent;color:var(--brand);font-weight:700;font-size:13.5px;padding:2px 0}
.optc{display:flex;gap:6px;padding-left:54px}.optc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}.optc button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);font-weight:700}
.mlist{list-style:none;margin:0;padding:0 0 0 54px;display:flex;flex-direction:column;gap:3px;font-size:15.5px}.mlist .alts{display:block;font-size:14px;color:var(--muted)}
details.tip2>summary{cursor:pointer;font-weight:700;list-style:none;padding:12px 0}details.tip2>summary::-webkit-details-marker{display:none}details.tip2>summary::after{content:"+";float:right;color:var(--muted);font-weight:400}details.tip2[open]>summary::after{content:"−"}
.card.tight details.tip2{border-top:1px solid var(--line)}.card.tight details.tip2:first-child{border-top:0}details.tip2 p{margin:0 0 12px}
details.card.tip2{gap:0;padding:4px 16px}details.card.tip2>summary{padding:10px 0}details.card.tip2 .eyebrow{font-weight:700}
/* pulsante tondo dell'assistente e pannello */
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:12;width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 10px 24px rgba(22,37,29,.28)}
.fab svg,.fabic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sheetbg{position:fixed;inset:0;z-index:20;background:rgba(10,20,14,.35)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;height:min(86vh,720px);background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.sheeth{display:flex;align-items:center;gap:10px}.sheeth b{flex:1;font-family:var(--f-display);font-size:18px}
.fabic{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}.fabic svg{width:19px;height:19px}
.sheet .chat{flex:1;overflow:auto;padding:4px 2px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:12px}
.card.tight{gap:0;padding:6px 16px}
.todo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.todo:first-child{border-top:0}.todo span{display:flex;flex-direction:column}.todo small{color:var(--muted);font-size:13.5px}
.pick{display:flex;gap:6px;flex-wrap:wrap}.pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;font-size:15px;min-height:44px}
.pick button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700}
.pick.days2{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.pick.days2 button{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:58px}.pick.days2 small{font-size:12px;opacity:.8}
.sum{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.field2{display:flex;flex-direction:column;gap:4px}.field2 input{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--surface)}
</style>

<script>
/* ===================================================== App paziente NutriLab
   I dati arrivano da NutriLab come «pacchetto» cifrato (AES-GCM, chiave da PIN con PBKDF2) dentro il link personale o incollato come codice.
   La pagina non contiene dati di pazienti reali: senza pacchetto mostra un esempio dichiarato. Nulla viene inviato a un server. */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const LS={get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },del(k){ try{ localStorage.removeItem(k); }catch(e){} }};
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(n)=>{ const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); };

/* ---- esempio dichiarato: persona inventata, valori plausibili */
const DEMO={v:1,demo:1,mind:1,bk:{demo:1,tipi:['supporto','orientamento']},hd:{sc:''},gen:ymd(new Date()),st:{n:'Dott. Federico Spina',ph:'+39 351 879 7908',web:'https://nutrizionistaspina.it'},
 pz:{n:'Martina',full:'Martina (esempio)'},
 ap:[{s:addDays(9)+'T17:00',t:'Incontro di supporto',dur:40,sd:'Pisa',str:'Centro Le Mura',ind:'Via Emanuele Filiberto 5, 56127 Pisa',on:0},
     {s:addDays(37)+'T16:20',t:'Valutazione della composizione corporea',dur:20,sd:'Online',str:'',ind:'',on:1}],
 past:[{d:addDays(-26),t:'Prima visita'},{d:addDays(-54),t:'Incontro di orientamento'}],
 pl:{n:'Piano mediterraneo · 1600 kcal',d:[0,1,2,3,4,5,6].map(i=>[DAYS[i],[
   ['Colazione','07:30',[[['Yogurt greco bianco 150 g','Kefir 200 g'],['Fiocchi d\'avena 30 g','Pane integrale 40 g'],['Frutti di bosco 100 g','Kiwi 100 g']]]],
   ['Spuntino','10:30',[[['Mandorle 15 g','Noci 15 g']]]],
   ['Pranzo','13:00',[[[i%2?'Riso integrale 70 g':'Pasta integrale 70 g','Farro 70 g'],[i%3?'Lenticchie secche 50 g':'Ceci secchi 50 g','Petto di pollo 120 g'],['Verdure di stagione 200 g'],['Olio extravergine di oliva 10 g']]]],
   ['Merenda','16:30',[[['Mela 150 g','Pera 150 g']]]],
   ['Cena','20:00',[[[i%2?'Salmone 130 g':'Merluzzo 150 g','Uova 2'],['Patate 200 g','Pane integrale 60 g'],['Verdure cotte 250 g'],['Olio extravergine di oliva 10 g']]]]]]),
   note:'Bevi 1,5-2 litri di acqua al giorno. Il sale aggiunto va tenuto sotto i 5 g al giorno: usa erbe, spezie e limone.'},
 edu:[['Le verdure all\'inizio del pasto','Mangiare prima la verdura aiuta a sentirsi sazi prima e rende più stabile la glicemia.'],
      ['Pasti fuori casa','Al ristorante scegli un primo o un secondo con contorno di verdure; il pane resta fuori se c\'è già un carboidrato.'],
      ['Movimento','Cammina almeno 30 minuti al giorno: anche spezzati in tre camminate da 10 minuti contano.']],
 sup:[{n:'Vitamina D3',d:'1000 UI al giorno',w:'a pranzo, con il pasto',why:'valori bassi agli ultimi esami'},{n:'Magnesio citrato',d:'300 mg',w:'la sera',why:'crampi e sonno'}],
 int:[{m:'Levotiroxina',a:'Prendila a stomaco vuoto, 30-60 minuti prima della colazione; caffè, latte, soia e integratori di calcio o ferro almeno 4 ore dopo.'}],

/* ---- decifratura del pacchetto */
const b64u={dec(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }};
async function inflate(u){ const ds=new DecompressionStream('deflate-raw'); const r=new Blob([u]).stream().pipeThrough(ds); return new Uint8Array(await new Response(r).arrayBuffer()); }
async function openPack(code,pin){ const raw=b64u.dec(code.replace(/^p/,'')); if(raw[0]!==1) throw new Error('versione');
  const salt=raw.slice(1,17), iv=raw.slice(17,29), data=raw.slice(29);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data));
  const json=plain[0]===1?new TextDecoder().decode(await inflate(plain.slice(1))):new TextDecoder().decode(plain.slice(1));
  return JSON.parse(json); }

const b64e=u=>{ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const cat=(...a)=>{ const n=a.reduce((s,x)=>s+x.length,0), o=new Uint8Array(n); let k=0; for(const x of a){ o.set(x,k); k+=x.length; } return o; };
async function seal(obj,pin){ const json=new TextEncoder().encode(JSON.stringify(obj)); let body;
  try{ body=cat(new Uint8Array([1]),new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())); }catch(e){ body=cat(new Uint8Array([0]),json); }
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);
  return 'r'+b64e(cat(new Uint8Array([1]),salt,iv,new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,body)))); }

async function shrink(file){ if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<1.5e6) return file;
  try{ const bmp=await createImageBitmap(file), k=Math.min(1,2000/Math.max(bmp.width,bmp.height)), c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)); return b?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file; }catch(e){ return file; } }

/* ---- assistente: risponde solo con i dati del pacchetto; altrimenti rimanda al Dottore */
function allSlots(){ const out=[]; for(const [dn,meals] of A.P.pl?.d||[]) for(const [ml,,groups] of meals) for(const g of groups) for(const sl of g) out.push({dn,ml,sl}); return out; }
function answer(q){ const n=norm(q), up=upcoming(), next=up[0];
  if(/spost|disdic|annull|non riesco a venire|cambiare (la )?(data|visita)/.test(n)) return {t:next?`${AMB().disdette} Ti preparo già il messaggio per la visita di ${longDay(next)} alle ${hm(next)}.`:`${AMB().disdette}`,logi:1,wa:wa(next?`Buongiorno, devo spostare la visita di ${longDay(next)} alle ${hm(next)}. ${A.P.pz?.full||''}`:'Buongiorno, vorrei fissare un appuntamento.')};
  { const am=AMB();
    if(/cost|prezz|tariff|quanto (si )?pag|quanto viene/.test(n)) return {t:`${am.prezzi.map(p=>`${p[0]}: ${p[1]}`).join('; ')}. ${am.detrazione}`};
    if(/pagament|bancomat|carta di credito|contant|come pago|posso pagare/.test(n)) return {t:`Sui pagamenti: ${am.pagamenti}. ${am.detrazione}`};
    if(/detra|730|dichiarazion|spese sanitarie/.test(n)) return {t:am.detrazione};
    if(/cosa (devo )?portar|cosa porto|devo portare|portare in visita/.test(n)) return {t:`Porta: ${am.portare.join('; ')}.`};
    if(/parchegg/.test(n)) return {t:am.parcheggio};
    if(/minorenn|mio figli|mia figli|bambin|ragazz/.test(n)) return {t:am.minori};
    if(/follow|telefonat|richiam|chiamata di controllo|mi chiama/.test(n)) return {t:am.followup};
    if(/lista d.?attesa|come (si )?prenot|prenotare|prenoto|nuova visita|fissare/.test(n)) return bkOn()?{t:'Puoi prenotare qui nell\'app: scegli la visita, la sede, il giorno e l\'orario libero. Il Dottore riceve subito la richiesta.',go:'prenota'}:{t:`${am.sedi.map(s=>`${s[0]} (${s[1]}): ${s[2]}`).join('. ')}.`,wa:wa('Buongiorno, vorrei fissare un appuntamento.')};
    if(/online|videochiam|a distanza/.test(n)) return {t:`Visite online: ${am.sedi.find(s=>s[0]==='Online')?.[2]||''}. Il link della videochiamata arriva per email.`};
    if(/whatsapp|email|contatt|come (ti|lo|vi) scriv/.test(n)) return {t:am.canali}; }
  if(/prossim|quando .*visita|appuntament|controllo/.test(n)&&!/integr/.test(n)) return {t:next?`La prossima visita è ${longDay(next)} alle ${hm(next)}: ${next.t.toLowerCase()}, ${where(next).toLowerCase().startsWith('in video')?'in videochiamata':'presso '+where(next)}.`+(up[1]?` La successiva è ${longDay(up[1])} alle ${hm(up[1])}.`:''):'Non hai visite in programma. Vuoi scrivere al Dottore per fissarla?',wa:next?'':wa('Buongiorno, vorrei fissare il prossimo appuntamento.')};
  if(/dove|indirizz|sede|parchegg|come arriv/.test(n)) return {t:next?`${where(next)}.`+(mapLink(next)?' Trovi le indicazioni nella scheda della visita in Oggi.':''):'Non ho visite in programma da cui prendere l\'indirizzo.'};
  const meal=[['colazione','Colazione'],['spuntino','Spuntino'],['pranzo','Pranzo'],['merenda','Merenda'],['cena','Cena']].find(([k])=>n.includes(k));
  const sub=n.match(/(?:al posto (?:del|della|dello|dei|delle|degli|di)|invece (?:del|della|dello|dei|delle|di)|sostituire|sostituisco|alternativ[ae] (?:al|alla|allo|ai|alle|a)|cambiare)\s+(?:il |la |lo |i |le |gli |l')?([a-zà-ù' ]{3,})/);
  if(sub){ const w=sub[1].trim().split(' ')[0].replace(/i$|e$|a$|o$/,''); const hits=allSlots().filter(x=>x.sl.some(s=>norm(s).includes(w)));
    if(hits.length){ const h=hits[0], alt=h.sl.filter(s=>!norm(s).includes(w)); return {t:alt.length?`Nel tuo piano, a ${h.ml.toLowerCase()} puoi sostituirlo con: ${alt.join(', ')}. Queste alternative hanno valori simili.`:`Nel piano non c'è un'alternativa indicata per questo alimento a ${h.ml.toLowerCase()}. Chiedi al Dottore prima di cambiarlo.`,wa:alt.length?'':wa(`Buongiorno, nel piano posso sostituire "${hits[0].sl[0]}"? ${A.P.pz?.full||''}`)}; }
    return {t:'Questo alimento non è nel tuo piano: per sostituzioni diverse da quelle indicate chiedi al Dottore.',wa:wa(`Buongiorno, avrei una domanda sul piano: ${q}`)}; }
  if(meal||/mangio|mangiare oggi|menu|menù|cosa .*oggi/.test(n)){ const di=/domani/.test(n)?((new Date().getDay())%7):(new Date().getDay()+6)%7, dp=dayPlan(di); if(dp){ const ms=meal?dp[1].filter(m=>norm(m[0]).includes(meal[0])):dp[1];
      if(ms.length) return {t:ms.map(m=>`${m[0]}${m[1]?' ('+m[1]+')':''}: `+m[2].map((g,gi)=>(m[2].length>1?`opzione ${gi+1}: `:'')+g.map(sl=>sl[0]+(sl.length>1?` (oppure ${sl.slice(1).join(', ')})`:'')).join('; ')).join(' — ')).join('\n')}; } }
  const sups=A.P.sup||[], sh=sups.find(s=>norm(s.n).split(/\s+/).some(w=>w.length>3&&n.includes(w)));
  if(/integrator|vitamin|magnesio|omega|probiotic|prendo|assumere/.test(n)||sh){ const list=sh?[sh]:sups; if(list.length) return {t:list.map(s=>`${s.n}: ${[s.d,s.w&&('quando: '+s.w)].filter(Boolean).join(', ')}.`).join('\n')+(sh?'':'\nPer integratori diversi da questi chiedi prima al Dottore.')}; }
  const it=(A.P.int||[]).find(x=>norm(x.m).split(/\s+/).some(w=>w.length>3&&n.includes(w)));
  if(it) return {t:`${it.m}: ${it.a}`};
  if(/farmac|medicin|pillol|interazion/.test(n)) return {t:'Per farmaci e interazioni non indicati qui serve il parere del Dottore o del tuo medico.',wa:wa(`Buongiorno, avrei una domanda su un farmaco: ${q}`)};
  const words=n.split(/[^a-zà-ù]+/).filter(w=>w.length>4); const tips=[...(A.P.edu||[]).map(t=>t[0]+'. '+t[1]),A.P.pl?.note||''].filter(Boolean);
  let best=null,score=0; for(const t of tips){ const s=words.filter(w=>norm(t).includes(w.slice(0,-1))).length; if(s>score){ score=s; best=t; } }
  if(best) return {t:`Tra le indicazioni del Dottore: ${best}`};
  return null; }
/* ---- limiti dell'assistente: domande al giorno, risposte con Claude al giorno, lunghezza massima, una domanda ogni pochi secondi.
   I limiti li fissa il Dottore in NutriLab (pacchetto «lim»); il conteggio è sul telefono e si azzera a mezzanotte */
const LIM=()=>({day:10,ai:5,len:300,gap:8,...(A.P?.lim||{})});
const usage=()=>{ const k='nlp_use_'+ymd(new Date()); let u; try{ u=JSON.parse(LS.get(k)||'null'); }catch(e){} return u||{k,q:0,ai:0,last:0}; };
const useSave=u=>{ LS.set(u.k,JSON.stringify(u)); A.use=u; };
function limitLeft(){ const L=LIM(), u=A.use||usage(); return Math.max(0,L.day-u.q); }
async function ask(q){ q=q.trim(); if(!q) return; const L=LIM(), u=A.use||usage(), now=Date.now();
  if(u.q>=L.day){ A.chat.push({b:1,t:`Hai usato le ${L.day} domande di oggi: l'assistente torna disponibile domani. Per qualcosa che non può aspettare scrivi al Dottore.`,wa:wa('Buongiorno, avrei una domanda: '+q.slice(0,L.len))}); render(); return; }
  if(now-u.last<L.gap*1000){ A.chat.push({b:1,t:`Un attimo: puoi fare una nuova domanda tra ${Math.ceil((L.gap*1000-(now-u.last))/1000)} secondi.`}); render(); return; }
  if(q.length>L.len){ A.chat.push({b:1,t:`La domanda è troppo lunga (massimo ${L.len} caratteri). Prova a scriverla in breve, oppure scrivi direttamente al Dottore.`,wa:wa('Buongiorno, avrei una domanda: '+q)}); render(); return; }
  u.q++; u.last=now; useSave(u); A.chat.push({t:q}); let r=answer(q);
  if(!r&&A.ai&&u.ai<L.ai){ u.ai++; useSave(u); A.busy=true; render();
    try{ const ctx=JSON.stringify({piano:A.P.pl,consigli:A.P.edu,integratori:A.P.sup,farmaci:A.P.int,visite:upcoming()}).slice(0,20000);
      const out=await A.ai(`Sei l'assistente dell'app del Dr. Federico Spina, biologo nutrizionista: l'evoluzione di Ambrogio, il chatbot dello studio. Rispondi in italiano, dando del tu, con tono cortese e professionale, in massimo 3 frasi, usando SOLO le indicazioni del Dottore e le REGOLE DELLO STUDIO qui sotto. Se la risposta non c'è, o la domanda riguarda sintomi, diagnosi, farmaci nuovi, dosi o cambi del piano, rispondi solo: "Questa domanda è da fare al Dottore." Non dare mai consigli medici, non promettere risultati, non usare toni pubblicitari, non proporre sconti o rate. Le visite non si spostano né si annullano dall'app: invita a scrivere al Dottore. Per domande sul piano il canale è l'email; WhatsApp solo per urgenze logistiche.\n\nREGOLE DELLO STUDIO: ${ambText()}\n\nINDICAZIONI DEL DOTTORE: ${ctx}\n\nDOMANDA: ${q}`,{modelTier:'quick'});
      const t=(out?.text||'').trim(); r={t:t||'Questa domanda è da fare al Dottore.',wa:/dottore/i.test(t)?wa(`Buongiorno, avrei una domanda: ${q}`):''}; }
    catch(e){ r=null; } A.busy=false; }
  A.chat.push({b:1,...(r||{t:'Su questo non ho indicazioni dal Dottore. Ti preparo un messaggio per chiederlo a lui.',wa:wa(`Buongiorno, avrei una domanda: ${q}`)})}); render(); setTimeout(()=>{ const c=$('#chat'); c?.lastElementChild?.scrollIntoView({block:'nearest',behavior:'smooth'}); },30); }

  catch(e){ lockScreen('Codice non corretto: controlla le 6 cifre.'); } }

function render(){ if(!A.P) return; if(A.tab==='chiedi'){ A.tab='oggi'; A.chatOpen=true; } const scr=({oggi:scrOggi,piano:scrPiano,visite:scrVisite,integr:scrIntegr,quest:scrQuest,diario:scrDiario,prenota:scrPrenota,salute:scrSalute}[A.tab]||scrOggi)();
  $('#root').innerHTML=`<main class="shell screen" id="main">${scr}${A.P.demo?`<section class="card"><span class="eyebrow">Questa è un'app di esempio</span><p class="small">Con il link personale del Dottore qui trovi il tuo piano, le tue visite e i tuoi integratori.</p><div class="row"><button class="btn" id="tolock">Ho un link o un codice</button></div></section>`:`<p class="foot">Aggiornata al ${esc(new Date(A.P.gen).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'}))} · <button class="btn ghost small" id="logout">Esci</button></p>`}</main>
   <div class="tabs"><nav aria-label="Sezioni">${[['oggi','Oggi'],['piano','Piano'],['visite','Visite'],['integr','Integratori']].map(([k,l])=>`<button data-tab="${k}"${A.tab===k||(k==='visite'&&A.tab==='prenota')?' aria-current="page"':''}>${ICON[k]}<span>${l}</span></button>`).join('')}</nav></div>
   ${chatOn()&&!A.chatOpen?`<button class="fab" data-chat="open" aria-label="Apri l'assistente">${ICON.chiedi}</button>`:''}${chatOn()&&A.chatOpen?chatSheet():''}`;
  if(A.chatOpen) setTimeout(()=>{ const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight; },10); }

document.addEventListener('click',e=>{ const c=e.target.closest('[data-chat]'); if(!c) return; e.preventDefault(); A.chatOpen=c.dataset.chat==='open'; render(); if(A.chatOpen) setTimeout(()=>$('#q')?.focus({preventScroll:true}),60); },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&A.chatOpen){ A.chatOpen=false; render(); } });
document.addEventListener('click',e=>{ const t=e.target.closest('button,[data-q]'); if(!t) return;
  if(t.dataset.tab){ A.tab=t.dataset.tab; A.chatOpen=false; render(); window.scrollTo(0,0); return; }
  if(t.dataset.go){ A.tab=t.dataset.go; A.chatOpen=false; HD.err=''; HD.msg=''; if(t.dataset.go==='quest') A.q=null; if(t.dataset.go==='prenota'){ Object.assign(BK,{tipo:'',sede:'',day:'',time:'',days:null,times:null,err:'',ok:null}); } render(); window.scrollTo(0,0); return; }
  if(t.dataset.bk){ const k=t.dataset.bk, v=t.dataset.v;
    if(k==='tipo'){ Object.assign(BK,{tipo:v,sede:'',day:'',time:'',days:null,times:null,err:''}); const O=BK.opt, T=(O?.tipi||[]).find(x=>x.tipo===v), S=(O?.sedi||[]).filter(x=>!T?.sedi?.length||T.sedi.includes(x)); if(S.length===1){ BK.sede=S[0]; bkDays(); return; } render(); return; }
    if(k==='sede'){ Object.assign(BK,{sede:v,day:'',time:'',days:null,times:null,err:''}); bkDays(); return; }
    if(k==='day'){ Object.assign(BK,{day:v,time:'',times:null,err:''}); bkTimes(); return; }
    if(k==='time'){ BK.time=v; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
    if(k==='send'){ const em=$('#bkem'); if(em) BK.em=em.value.trim(); if(!A.P.bk.demo&&!A.P.bk.em&&!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(BK.em)){ BK.err='Scrivi la tua email per ricevere la conferma.'; render(); return; } bkSend(); return; }
    if(k==='done'){ BK.ok=null; A.tab='visite'; render(); window.scrollTo(0,0); return; } return; }
  if(t.dataset.qopen){ A.q=t.dataset.qopen; render(); window.scrollTo(0,0); return; }
  if(t.dataset.qa!=null){ const k=A.q; (A.ans[k]||={})[t.dataset.qa]=t.dataset.v; A.out=''; saveAns(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.id==='qsend'){ (async()=>{ const L=A.P.scr||[]; const code=await seal({v:1,pz:A.P.pz?.full||'',at:new Date().toISOString(),r:L.map(q=>({k:q.k,a:A.ans[q.k]||{}}))},A.pin);
      A.out=`Buongiorno, ho compilato i questionari (${L.map(q=>q.name.split(' · ')[0]).join(', ')}). Codice delle risposte per NutriLab: ${code}`; render(); })(); return; }
  if(t.dataset.mm){ (A.md||=mNew()).m=t.dataset.mm; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.ms){ const d=(A.md||=mNew()), v=+t.dataset.v; d[t.dataset.ms]=d[t.dataset.ms]===v?null:v; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.me){ const d=(A.md||=mNew()); d.emo=d.emo.includes(t.dataset.me)?d.emo.filter(x=>x!==t.dataset.me):[...d.emo,t.dataset.me]; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.mx){ const d=(A.md||=mNew()); d[t.dataset.mx]=!d[t.dataset.mx]; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.id==='msave'){ const d=A.md; if(!d||(d.pre==null&&d.post==null)) return; const L=mLoad(); L.push({at:new Date().toISOString(),m:d.m,pre:d.pre,post:d.post,emo:d.emo,scr:d.scr,fr:d.fr,n:(d.n||'').trim().slice(0,200)}); mSave(L); A.md=mNew(); A.mout=''; render(); window.scrollTo(0,0); return; }
  if(t.id==='msend'){ (async()=>{ const L=mLoad(), U=L.filter(e=>!e.sent); if(!U.length) return; const code=await seal({v:1,pz:A.P.pz?.full||'',at:new Date().toISOString(),r:[],mind:U.map(({sent,...e})=>e)},A.pin);
      A.mout=`Buongiorno, le mando il diario della fame (${U.length} pasti). Codice per NutriLab: ${code}`; A.mpend=U.map(e=>e.at); render(); })(); return; }
  if(t.id==='mcopy'){ navigator.clipboard?.writeText(A.mout).then(()=>{ t.textContent='Copiato'; mMark(); },()=>{ document.querySelector('textarea.code')?.select(); }); return; }
  if(t.id==='qcopy'){ navigator.clipboard?.writeText(A.out).then(()=>{ t.textContent='Copiato'; },()=>{ const ta=document.querySelector('textarea.code'); ta?.select(); }); return; }
  if(t.dataset.day){ A.day=+t.dataset.day; render(); return; }
  if(t.dataset.psub){ A.psub=t.dataset.psub; HD.err=''; HD.msg=''; render(); window.scrollTo(0,0); return; }
  if(t.hasAttribute('data-hdsend')){ hdSend(); return; }
  if(t.hasAttribute('data-hdlink')){ hdLinkSend(); return; }
  if(t.hasAttribute('data-sccopy')){ navigator.clipboard?.writeText(scCode()).then(()=>{ t.textContent='Copiato'; },()=>{ prompt('Copia il codice',scCode()); }); return; }
  if(t.dataset.alt!=null){ const k=t.dataset.alt; A.alt.has(k)?A.alt.delete(k):A.alt.add(k); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.opt!=null){ A.opt[t.dataset.opt]=+t.dataset.v; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.q){ ask(t.dataset.q); return; }
  if(t.id==='demo'){ A.P=DEMO; loadAns(); A.tab='oggi'; render(); return; }
  if(t.id==='tolock'){ A.P=null; if(A.code||A.sid||LS.get('nlp_code')||LS.get('nlp_sid')) lockScreen(); else pasteScreen(); return; }
  if(t.id==='other'){ LS.del('nlp_code'); LS.del('nlp_pin'); LS.del('nlp_sid'); A.code=null; A.sid=null; pasteScreen(); return; }
  if(t.id==='logout'){ LS.del('nlp_pin'); A.P=null; lockScreen(); return; }
  if(t.id==='usecode'){ const raw=($('#pcode').value||'').trim(), v=raw.match(/p[A-Za-z0-9_-]{60,}/), sid=!v&&sidOf(raw); if(v){ A.code=v[0]; A.sid=null; lockScreen(); } else if(sid){ A.sid=sid; A.code=null; lockScreen(); } else { const c=$('#cerr'); if(c) c.textContent='Non trovo il codice: copia dal messaggio del Dottore la riga lunga che inizia con la lettera p.'; } return; } });
const mMark=()=>{ if(!A.mpend) return; const L=mLoad(); for(const e of L) if(A.mpend.includes(e.at)) e.sent=1; mSave(L); A.mpend=null; };
document.addEventListener('click',e=>{ if(e.target.closest?.('#mwa')) setTimeout(mMark,300); });
document.addEventListener('change',e=>{ if(e.target.id==='hdfile') hdUpload(e.target.files?.[0]); });
document.addEventListener('input',e=>{ const t=e.target; if(t.id==='bkem'){ BK.em=t.value; return; } if(t.dataset?.hd){ HD.f[t.dataset.hd]=t.value; return; } if(t.id==='hdlink'){ HD.f.link=t.value; return; } if(t.id==='hdlt'){ HD.f.lt=t.value; return; } if(t.id==='mnote'){ (A.md||=mNew()).n=t.value; return; } if(t.dataset?.qn!=null){ (A.ans[A.q]||={})[t.dataset.qn]=t.value.replace(',','.'); A.out=''; saveAns(); } });
document.addEventListener('submit',e=>{ e.preventDefault();
  if(e.target.id==='pinf'){ const pin=($('#pin').value||'').replace(/\D/g,''); if(pin.length!==6){ $('#perr').textContent='Il codice ha 6 cifre.'; return; } tryPin(pin,$('#rem').checked); }
  if(e.target.id==='askf'){ const q=$('#q').value; ask(q); } });
document.addEventListener('paste',e=>{ if(e.target.id==='pcode') setTimeout(()=>{ const v=(e.target.value||'').match(/p[A-Za-z0-9_-]{60,}/); if(v){ A.code=v[0]; lockScreen(); } },20); });

(async()=>{ A.code=hashCode();
  /* sul dominio dello studio il link porta il codice breve: https://app.nutrizionistaspina.it/#ABCD-EF23 */
  if(!A.code&&HOSTED){ const hs=sidOf(' '+decodeURIComponent((location.hash||'').slice(1))); if(hs){ if(hs!==LS.get('nlp_sid')){ LS.del('nlp_pin'); LS.del('nlp_code'); } A.sid=hs; LS.set('nlp_sid',hs); } }
  const saved=LS.get('nlp_code')||LS.get('nlp_sid'), pin=LS.get('nlp_pin');
  if(A.code&&saved&&A.code!==LS.get('nlp_code')){ LS.del('nlp_pin'); LS.del('nlp_sid'); }
  if(!A.code&&saved&&pin){ await tryPin(pin,true); }
  else if(A.code||saved) lockScreen(); else pasteScreen();
  try{ const s=await window.claude?.use?.('sample'); if(s){ A.ai=s; if(A.P&&A.tab==='chiedi') render(); } }catch(e){} })();
</script>
